[package]
name = "kopaid"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
argon2 = "0.5.3"
chrono = "0.4.45"
derive_more = { version = "2.1.1", features = ["display"] }
dotenvy = "0.15.7"
futures-util = "0.3.32"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "time", "migrate"] }
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }
